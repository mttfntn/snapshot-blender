name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:   # the release workflow runs these same tests first

env:
  # Exactly the supported version (see solid_snapshot/blender_manifest.toml).
  BLENDER_VERSION: "5.3.0"

jobs:
  test:
    name: Blender 5.3 on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash tools/ci/download_blender.sh "$BLENDER_VERSION" "$HOME/blender"

      - name: Install display and OpenGL libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth \
            libgl1 libegl1 libglx-mesa0 libgl1-mesa-dri libxkbcommon0 libxkbcommon-x11-0 \
            libxi6 libxrender1 libxxf86vm1 libxfixes3 libsm6 libice6 libx11-6 libxext6 \
            libxcursor1 libxinerama1 libxrandr2 libwayland-client0 libdecor-0-0

      - name: Run tests (virtual display, software OpenGL)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            python3 tests/run_tests.py --blender "$HOME/blender/blender" --json test-results.json

      - name: Build package
        run: python3 tools/build.py --blender "$HOME/blender/blender"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.zip
          retention-days: 3

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.json
          if-no-files-found: ignore
          retention-days: 3
